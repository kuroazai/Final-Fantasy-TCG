name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: No runtime dependencies crept in
        # The package has none, and that is a feature worth defending. The
        # previous version imported nltk, openai, langchain, selenium, redis,
        # pymongo, mysql-connector and beautifulsoup4; the part that worked was
        # regex over card text.
        run: |
          python -c "
          import sys, ffparse
          from ffparse import cli, effects, models, parser, patterns
          leaked = [n for n in ('nltk', 'openai', 'langchain', 'selenium',
                                'requests', 'redis', 'pymongo', 'bs4')
                    if n in sys.modules]
          assert not leaked, 'imported at module scope: ' + ', '.join(leaked)
          print('clean')
          "

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=ffparse --cov-report=term-missing

      - name: The CLI works
        run: |
          ffparse rules
          ffparse text "When Zack enters the field, deal it 2000 damage."
